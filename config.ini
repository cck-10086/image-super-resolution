﻿# 图像超分辨率系统配置文件

[model]
# 放大倍率选项
scale_factors = [2, 4, 8]
# 残差块数量
res_blocks = 32
# 特征通道数
num_features = 256
# 残差缩放因子
res_scale = 0.1
# 权重文件路径
weights_dir = "model_weights"
x2_weights = "model_weights/edsr_x2_best.pth"
x4_weights = "model_weights/edsr_x4_best.pth"
resrgan_weights = "model_weights/RealESRGAN_x4plus.pth"

[training]
# 数据集路径
data_dir = "./data_new"
train_dir = "./data_new/train"
val_dir = "./data_new/val"
# 训练参数
batch_size = 16
learning_rate = 0.0001
num_epochs = 100
patch_size = 96
# 优化器
optimizer = "adam"
weight_decay = 0
# 学习率调度
lr_scheduler = "step"
lr_step_size = 30
lr_gamma = 0.5
# 模型保存
save_dir = "model_weights"
save_interval = 20

[server]
host = "0.0.0.0"
port = 5000
debug = false
# 上传配置
upload_folder = "uploads"
output_folder = "outputs"
max_file_size = 10485760
# 允许的文件格式
allowed_extensions = [".png", ".jpg", ".jpeg", ".webp"]

[image]
# 输入限制
input_size_limit = 2048
output_format = "PNG"
# 质量设置
jpeg_quality = 95
png_compression = 6